<link rel="canonical" href="/aicodingagentteam/en/" />
<meta name="robots" content="noindex" />
<style>html,body{margin:0;background:#050508;color:#f8fcff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;min-height:100vh;align-items:center;justify-content:center}a{color:#00d2ff}</style>

<body>
<p style="padding:2rem">Redirecting… <a href="/aicodingagentteam/en/">/aicodingagentteam/en/</a></p>
<script>
(function () {
  var B = "/aicodingagentteam/";
  var locales = ["en","zh","ja","ko","fr","de","ru","es","it"];
  var names = { en: "English", zh: "简体中文", ja: "日本語", ko: "한국어", fr: "Français", de: "Deutsch", ru: "Русский", es: "Español", it: "Italiano" };
  var stored = null;
  try { stored = localStorage.getItem("locale"); } catch (e) {}
  if (stored && locales.indexOf(stored) !== -1) {
    window.location.replace(B + stored + "/");
    return;
  }
  var langs = (navigator.languages || [navigator.language || "en"]).map(function (l) { return l.toLowerCase().split("-")[0]; });
  var match = "en";
  for (var i = 0; i < langs.length; i++) {
    if (locales.indexOf(langs[i]) !== -1) { match = langs[i]; break; }
  }
  try { localStorage.setItem("locale", match); } catch (e) {}
  window.location.replace(B + match + "/");
})();
</script>
</body>
</html>
