version: 2

project_name: aicodingagentteam

before:
  hooks:
    - go mod tidy

builds:
  - id: aicodingagentteam
    main: ./cmd/aicodingagentteam
    binary: aicodingagentteam
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "linux"}}Linux
      {{- else if eq .Os "darwin"}}macOS
      {{- else if eq .Os "windows"}}Windows
      {{- end}}_
      {{- if eq .Arch "amd64"}}x86_64
      {{- else if eq .Arch "arm64"}}ARM64
      {{- end}}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - README.zh.md
      - README.ja.md
      - README.ko.md
      - README.fr.md
      - README.de.md
      - README.ru.md
      - README.es.md
      - README.it.md
      - LICENSE
      - CHANGELOG.md
      - docs/*.md
      - deploy/compose/docker-compose.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: agentcodinglab
    name: aicodingagentteam
  draft: true
  prerelease: auto
  name_template: "{{ .Tag }}"